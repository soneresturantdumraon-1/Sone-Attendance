<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Attendance">
<title>Attendance</title>
<link rel="icon" id="fav" href="data:,">
<link rel="apple-touch-icon" id="ati" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a60ff">
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--tx2:#8e8e93;--sep:rgba(60,60,67,.2);--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--fill:rgba(120,120,128,.12);--segon:#fff;--bar:rgba(249,249,249,.86);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.65);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--fill:rgba(120,120,128,.24);--segon:#636366;--bar:rgba(22,22,24,.86)}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.65);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--fill:rgba(120,120,128,.24);--segon:#636366;--bar:rgba(22,22,24,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.35;cursor:default}
svg{display:block;flex:none}
#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
#nav.sc{border-bottom-color:var(--sep)}
.navt{font-weight:600;opacity:0;transition:opacity .2s}
#nav.sc .navt{opacity:1}
#navr{position:absolute;right:6px;top:0;height:44px;display:flex;align-items:center}
.navbtn{display:flex;align-items:center;gap:5px;color:var(--blue);padding:8px 10px;font-size:15px;font-weight:500}
main{max-width:640px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom,0px))}
.ltrow{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
h1.lt{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.35px;margin:0}
.addbtn{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx2);font-size:10.5px;font-weight:500;padding:4px 0}
#tabbar button.on{color:var(--blue)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px}
.who{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--tx2)}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:18px}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.tag.P{color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}
.tag.H{color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent)}
.tag.A{color:var(--tx2);background:var(--fill)}
.brand{display:flex;align-items:center;gap:10px;margin:-2px 2px 12px}
.brand img{height:42px;width:auto}
.brand b{display:block;font-size:15px;letter-spacing:.4px}
.brand span{font-size:12px;color:var(--tx2)}
.alertbar{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:70;max-width:560px;margin:0 auto;background:rgba(28,28,30,.97);color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:alertdown .3s}
@keyframes alertdown{from{transform:translateY(-120%)}}
.alertbar .ai{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.alertbar b{display:block;font-size:15px}.alertbar span{font-size:12px;color:#c7c7cc}
details.gtabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}.gtabs button{flex:none;padding:8px 14px;border:0;border-radius:99px;background:rgba(120,120,128,.16);color:inherit;font:inherit;font-weight:600;font-size:14px}.gtabs button.on{background:var(--blue);color:#fff}
.gd{border-bottom:.5px solid var(--sep)}
details.gd:last-child{border-bottom:0}
details.gd summary{list-style:none;padding:13px 14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.gd summary::-webkit-details-marker{display:none}
details.gd summary::after{content:"›";color:var(--tx2);font-size:22px;transform:rotate(0);transition:.2s}
details.gd[open] summary::after{transform:rotate(90deg)}
details.gd .gb{padding:0 14px 14px;font-size:14.5px;color:var(--tx)}
details.gd .gb div{padding:4px 0 4px 14px;position:relative}
details.gd .gb div::before{content:"•";position:absolute;left:2px;color:var(--blue)}
.cbadge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.tag.L{color:var(--blue);background:color-mix(in srgb,var(--blue) 16%,transparent)}
.btn{height:44px;border-radius:12px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:15px}
.btn.pri{background:var(--blue);color:#fff}
.btn.tint{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.btn.red{background:var(--red);color:#fff}
.btn.wa{background:#25D366;color:#fff}
.btn.waR{background:#25D366;color:#fff;width:40px;height:40px;padding:0;border-radius:50%;flex:none}
.btn.plain{color:var(--blue);width:100%;height:36px;margin-top:6px}
.cta{width:100%;height:54px;border-radius:14px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;margin:0 0 14px}
.acts{display:flex;gap:8px;margin-top:12px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:600}
.seg button.on.P{color:var(--green)}.seg button.on.H{color:var(--orange)}.seg button.on.A{color:var(--tx2)}.seg button.on.L{color:var(--blue)}
.tiles{display:flex;padding:12px 0}
.tiles>div{flex:1;text-align:center;border-right:.5px solid var(--sep)}
.tiles>div:last-child{border:0}
.tiles b{display:block;font-size:28px;font-weight:700;line-height:1.1}
.tiles span{font-size:12px;color:var(--tx2)}
.g{color:var(--green)}.o{color:var(--orange)}.r{color:var(--red)}.mu{color:var(--tx2)}
.dateRow{display:flex;align-items:center;padding:4px}
.dpick{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;height:42px;cursor:pointer;color:var(--tx)}
.dpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;border:0;cursor:pointer}
.icbtn{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--blue)}
.icbtn.s{width:30px;height:30px;color:var(--red)}
.eng{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tx2);margin:-4px 2px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.dot.ok{background:var(--green)}.dot.loading{background:var(--tx2)}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin:0 0 12px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left;border-bottom:.5px solid var(--sep);color:var(--tx)}
.list>:last-child{border-bottom:0}
.lrow svg.ch{color:var(--tx2);opacity:.6}
.lrow.red{color:var(--red)}
.hd{font-size:13px;text-transform:uppercase;color:var(--tx2);margin:18px 16px 6px;letter-spacing:.2px}
.foot{font-size:13px;color:var(--tx2);margin:-6px 16px 12px}
.frow{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:46px;border-bottom:.5px solid var(--sep)}
.frow label{min-width:118px;color:var(--tx)}
.frow input:not(.sw){flex:1;min-width:0;border:0;background:transparent;color:var(--tx);font:inherit;padding:12px 0;margin:0;outline:none;text-align:right}
.frow select{flex:1;border:0;background:transparent;color:var(--tx);font:inherit;text-align:right}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:99px;background:rgba(120,120,128,.32);position:relative;transition:.2s;margin:0;flex:none;border:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
.irow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:.5px solid var(--sep)}
.irow:last-child{border-bottom:0}
.irow span{flex:1;min-width:0}
.irow b{font-weight:600;white-space:nowrap}
.amt{text-align:right;font-weight:700;font-size:20px;line-height:1.1}
.amt small{display:block;font-size:11px;font-weight:500;color:var(--tx2)}
.amt.g{color:var(--green)}.amt.r{color:var(--red)}
.banner{border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;margin-top:10px}
.banner.g{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.banner.r{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.banner.n{background:var(--fill);color:var(--tx)}
#kiosk{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.k-top{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.k-exit{color:#0a84ff;display:flex;align-items:center;gap:4px;font-size:16px}
.k-clock{text-align:right;font-size:14px;line-height:1.2;color:#c7c7cc}
.k-clock b{display:block;font-size:26px;color:#fff}
.k-stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:520px;width:100%;margin:0 auto}
.k-card{min-height:104px;border-radius:18px;background:rgba(255,255,255,.1);padding:16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:14px}
.k-card.ok{background:rgba(52,199,89,.25)}.k-card.warn{background:rgba(255,149,0,.25)}.k-card.bad{background:rgba(255,69,58,.25)}
.k-foot{text-align:center;color:#98989f;padding-top:8px}
.sec{font-weight:700;margin:14px 0 4px}
.empty{text-align:center;color:var(--tx2);padding:36px 20px}
.empty svg{margin:0 auto 10px;opacity:.5}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--tx2);font-weight:500;text-align:left;padding:6px 4px;border-bottom:.5px solid var(--sep);white-space:nowrap}
.tbl td{padding:7px 4px;border-bottom:.5px solid var(--sep);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.rt{text-align:right!important}
.scroll{overflow-x:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips button{flex:none;height:34px;padding:0 14px;border-radius:99px;background:var(--card);font-size:14px;font-weight:500}
.chips button.on{background:var(--blue);color:#fff}
.two{display:flex;gap:10px}.two>*{flex:1}
.two .frow{border:0;background:var(--fill);border-radius:10px;flex-direction:column;align-items:flex-start;gap:0;padding:6px 12px}
.two .frow label{min-width:0;font-size:12px;color:var(--tx2)}
.two .frow input{text-align:left;padding:2px 0 6px;width:100%}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.dayhead b{font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 12px}
.dh{text-align:center;font-size:11px;color:var(--tx2)}
.dcell{aspect-ratio:1;border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;line-height:1.1}
.dcell i{font-style:normal;font-size:11px;font-weight:700;height:12px}
.dcell.P{background:color-mix(in srgb,var(--green) 22%,var(--card));color:var(--green)}
.dcell.H{background:color-mix(in srgb,var(--orange) 22%,var(--card));color:var(--orange)}
.dcell.L{background:color-mix(in srgb,var(--blue) 22%,var(--card));color:var(--blue)}
.dcell.f{opacity:.3}
#sheetbg,#alertbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:30}
#sheetbg.show{display:flex;align-items:flex-end;justify-content:center}
#alertbg.show{display:flex;align-items:center;justify-content:center;z-index:40}
#sheet{background:var(--bg);width:100%;max-width:560px;border-radius:14px 14px 0 0;max-height:94%;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;position:sticky;top:0;background:var(--bg);z-index:2}
.sh-t{font-weight:600}
.lnk{color:var(--blue);min-width:72px;text-align:left}
.lnk.b{font-weight:600;text-align:right}
.sh-b{padding:4px 16px 22px}
#alert{background:var(--card);width:270px;border-radius:14px;overflow:hidden;text-align:center}
#alert .ab{padding:18px 16px 14px}#alert h4{margin:0 0 4px;font-size:17px}#alert p{margin:0;font-size:13px;color:var(--tx2)}
#alert .bt{display:flex;border-top:.5px solid var(--sep)}
#alert .bt button{flex:1;height:44px;color:var(--blue);font-size:17px}
#alert .bt button+button{border-left:.5px solid var(--sep);font-weight:600;color:var(--red)}
.vbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
.vbox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.oval{position:absolute;inset:10% 25%;border:2px dashed rgba(255,255,255,.75);border-radius:50%}
.cinfo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;aspect-ratio:4/3;background:var(--fill);border-radius:14px;color:var(--tx2);text-align:center;padding:16px;font-size:14px}
.thumb{width:96px;height:96px;border-radius:14px;object-fit:cover;flex:none}
.bigav{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--fill);color:var(--tx2)}
.photoBox{text-align:center;margin:6px 0 14px}
.hint{font-size:13px;color:var(--tx2);margin-top:2px}
textarea{width:100%;border:0;border-radius:12px;background:var(--card);color:var(--tx);font:13px/1.5 ui-monospace,Menlo,monospace;padding:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:rgba(40,40,42,.94);color:#fff;padding:11px 18px;border-radius:99px;z-index:60;font-size:15px;font-weight:500;white-space:nowrap}
.big{font-size:34px;font-weight:700;width:100%;text-align:center;border:0;background:transparent;color:var(--tx);outline:none;margin:6px 0 2px;padding:0;font-family:inherit}
.rqbadge{background:#ff3b30;color:#fff;border-radius:10px;min-width:20px;height:20px;padding:0 6px;font-size:12px;align-items:center;justify-content:center;margin-left:6px}
.bub{max-width:82%;padding:8px 10px;border-radius:14px;margin:0 0 8px;font-size:15px;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.bub i{display:block;font-size:11px;opacity:.6;font-style:normal;text-align:right;margin-top:2px}
.bub img{max-width:100%;border-radius:10px;display:block;margin-bottom:4px}
.bub.me{margin-left:auto;background:#d9fdd3;color:#111;border-bottom-right-radius:4px}
.bub.ow{background:var(--card);border-bottom-left-radius:4px}
.sysl{text-align:center;font-size:12px;color:#8e8e93;margin:6px 0 10px}
.rqc{display:flex;align-items:center;gap:6px;margin-top:8px}
.rqc input{flex:1;height:42px;border-radius:21px;background:var(--card);padding:0 14px;border:0;outline:0;color:inherit;font:inherit}
.rqi{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--blue);background:var(--card);flex:none;text-decoration:none}
.rqi.snd{background:var(--blue);color:#fff}
</style>
</head>

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const rs=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN');
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
function dayList(a,b){const o=[];let [y,m,d]=a.split('-').map(Number);for(let i=0;i<400;i++){const x=dstr(new Date(y,m-1,d+i));if(x>b)break;o.push(x)}return o}
const RATE_DAYS=30; /* daily rate always = salary / 30, whatever the month length */
const daysIn=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const idDate=id=>{const n=parseInt(String(id).slice(0,8),36);return n>1e12&&n<4e12?dstr(new Date(n)):null};
const trackStart=s=>{const j=(s.joined||'').slice(0,7),a=(s.added||idDate(s.id)||s.joined||today()).slice(0,7);return j>a?j:a};

  const prev0=bf+late,paidNow=late+c.taken+c.settled,prevApplied=prev0>0?Math.min(prev0,paidNow):0,prevLeft=prev0>0?prev0-prevApplied:prev0;
  return Object.assign({},c,{bf,late,prev0,prevApplied,prevLeft,bal:bf+c.net-c.taken-c.settled});
}

function attSheet(sid,m){
  const s=db.staff.find(x=>x.id===sid);m=m||today().slice(0,7);
  const dim=daysIn(m),T=today(),cur=T.slice(0,7),lead=parse(m+'-01').wd;
  let cells='';for(let i=0;i<lead;i++)cells+='<div></div>';
  let P=0,H=0,Lc=0;
  for(let d=1;d<=dim;d++){const ds=m+'-'+pad(d),a=attOf(sid,ds),ty=a?a.type:'A',fut=ds>T;if(ty==='P'&&!fut)P++;if(ty==='H'&&!fut)H++;if(ty==='L'&&!fut)Lc++;cells+=`<button class="dcell ${fut?'f':ty}" ${fut?'disabled':''} onclick="cycleAtt('${sid}','${ds}','${m}')"><b>${d}</b><i>${ty==='P'?'P':ty==='H'?'½':ty==='L'?'L':''}</i></button>`}
  const el=m<cur?dim:(m===cur?parse(T).d:0),A=Math.max(0,el-P-H-Lc-(m===cur&&pendingDay(db.staff.find(x=>x.id===sid),T)?1:0));
  sheet(s.name,`<div class="card dateRow"><button class="icbtn" onclick="attSheet('${sid}','${shiftM(m,-1)}')">${ic('chL',20)}</button><label class="dpick">${ic('cal',18)}<span>${mlabel(m)}</span><input type="month" max="${cur}" value="${m}" onchange="if(this.value)attSheet('${sid}',this.value)"></label><button class="icbtn" ${m>=cur?'disabled':''} onclick="attSheet('${sid}','${shiftM(m,1)}')">${ic('chR',20)}</button></div><div class="hint" style="text-align:center;margin-bottom:8px">${t('sheetHint')}</div><div class="dgrid">${WS_[lang].map(w=>`<div class="dh">${w}</div>`).join('')}${cells}</div><div class="card tiles"><div><b class="g">${P}</b><span>${t('present')}</span></div><div><b class="o">${H}</b><span>${t('half')}</span></div><div><b style="color:var(--blue)">${Lc}</b><span>${t('leave')}</span></div><div><b class="mu">${A}</b><span>${t('absent')}</span></div></div>`,{left:t('close'),right:t('done'),onRight:()=>{closeSheet();render()},onLeft:()=>render()});
}
function cycleAtt(sid,ds,m){
  const s=db.staff.find(x=>x.id===sid),a=attOf(sid,ds),next=!a?'P':a.type==='P'?'H':a.type==='H'?'L':'A';
  if(ds<(s.joined||'9999-99-99'))s.joined=ds;

  if(next!=='A')db.att.push({id:uid(),sid,date:ds,type:next,time:'',photo:null});
  save();attSheet(sid,m);
}

    o.items.forEach(it=>{

      ln.forEach((l,i)=>{const ry=y+100+i*56;tx(l[0],M+32,ry+34,{s:26,c:'#6e6e73',mw:640});tx(l[1],W-M-32,ry+34,{s:28,w:700,a:'right'})});

    return y+74;

  const c0=document.createElement('canvas');c0.width=W;c0.height=6000;
  const H=Math.ceil(draw(c0.getContext('2d'),6000));

}

function rangeFor(k){

}

function reportData(sid){

  const SL=sid?db.staff.filter(x=>x.id===sid):db.staff;

  dates.forEach(d=>{
    const day={d,rows:[],P:0,H:0,L:0,A:0,tk:0};

      if(ty==='P'){day.P++;sumRows[i].P++}else if(ty==='H'){day.H++;sumRows[i].H++}else if(ty==='L'){day.L++;sumRows[i].L++}else if(ty==='A'){day.A++;sumRows[i].A++}

function monthReportText(sid,m){
  const s=db.staff.find(x=>x.id===sid);
  const c=calcM(s,m),T=today(),first=m+'-01',last=m+'-'+pad(c.dim);
  const st=(s.joined||first)>first?s.joined:first,en=T<last?T:last;
  const n=en>=st?dayList(st,en).length:0;
  const P=c.at.filter(a=>a.type==='P').length,H=c.at.filter(a=>a.type==='H').length,Lv=c.at.filter(a=>a.type==='L').length,A=Math.max(0,n-P-H-Lv-(en===T&&pendingDay(s,T)?1:0));

  if(c.perfect)L.push(t('noLeaveBonus',{d:c.fullDays})+': +'+rs(c.bonus));
  if(s.cut&&!c.held&&c.ded)L.push(t('deduction',{n:c.absent})+': -'+rs(c.ded));
  L.push('',t('txns')+':');
  const ps=c.pays.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!ps.length)L.push(t('noTxns'));
  ps.forEach(p=>L.push(fmtD(p.date)+' — '+rs(p.amt)+(p.note?' ('+p.note+')':'')));
  const os=db.out.filter(o=>o.sid===sid&&o.date.startsWith(m)).sort((a,b)=>a.date===b.date?(a.out<b.out?-1:1):(a.date<b.date?-1:1));
  if(os.length){L.push('',t('outLog')+':');os.forEach(o=>L.push(fmtD(o.date)+' '+fmtT(o.out)+' – '+(o.in?fmtT(o.in)+' ('+fmtDur(durMin(o.out,o.in))+')':t('stillOut'))))}

/* ---------- Kiosk mode (auto face check-in) ---------- */
let kOn=false,kTimer=null,kClk=null,kBusy=false,kLast={sid:null,n:0},kUnk=0,kCool=0,kWake=null,kStream=null,kRev=null,kState='';
const nowHM=()=>new Date().toTimeString().slice(0,5);
function kCount(){const T=today(),p=db.staff.filter(s=>{const a=attOf(s.id,T);return a&&(a.type==='P'||a.type==='H')}).length;return t('kCount',{p:p,n:db.staff.length})}
function setK(st,m,tm){
  const el=$('#kcard');if(!el)return;
  if(st===kState&&(st==='look'||st==='loading'||st==='noengine'||st==='nofaces'))return;
  kState=st;
  let cls='',h='';
  if(st==='in'||st==='already'){cls=st==='in'?'ok':'warn';h=`${av(m,56)}<div style="text-align:left"><div style="font-size:20px;font-weight:700">${t('kWelcome',{n:esc(m.name)})}</div><div>${t(st==='in'?'kIn':'kAlready',{t:fmtT(tm)})}</div></div>`}
  else if(st==='out'||st==='back'){cls='ok';h=`${av(m,56)}<div style="text-align:left"><div style="font-size:19px;font-weight:700">${st==='out'?tg('kOut',{n:esc(m.name),t:fmtT(tm)},m.gender):tg('kBack',{n:esc(m.name),d:tm},m.gender)}</div></div>`}
  else if(st==='notin'||st==='recent'){cls='warn';h=`${av(m,56)}<div style="text-align:left;font-weight:600">${t(st==='notin'?'kNotIn':'kRecent',{n:esc(m.name)})}</div>`}
  else if(st==='unknown'){cls='bad';h=`<div style="font-size:18px;font-weight:600">${t('kUnknown')}</div>`}
  else if(st==='noengine'){cls='warn';h=`<div><div>${t('kNoEngine')}</div><button class="btn pri" style="margin-top:10px" onclick="kRetry()">${t('kRetry')}</button></div>`}
  else if(st==='cam'){cls='bad';h=`<div><div>${window.isSecureContext?t('kCam'):t('kInsecure')}</div><button class="btn pri" style="margin-top:10px" onclick="startKiosk()">${t('kRetry')}</button></div>`}
  else if(st==='nofaces'){cls='warn';h=`<div>${t('kNoFaces')}</div>`}
  else h=`<div style="font-size:18px;font-weight:600">${st==='loading'?t('kLoading'):t('kLook')}</div>`;
  el.className='k-card '+cls;el.innerHTML=h;
  const f=$('#kfoot');if(f)f.textContent=kCount();
  clearTimeout(kRev);
  if(st==='in'||st==='already'||st==='unknown'||st==='out'||st==='back'||st==='notin'||st==='recent')kRev=setTimeout(()=>{kState='';setK('look')},3500);
}
function kRetry(){faceState='loading';kState='';setK('loading');initFace()}
function kStop(){if(kStream){kStream.getTracks().forEach(x=>x.stop());kStream=null}}
async function startKiosk(){
  kStop();kState='';setK('look');
  try{
    kStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});
    const v=$('#kv');if(!v){kStop();return}
    v.srcObject=kStream;
  }catch(e){setK('cam');return}
  try{if(navigator.wakeLock)kWake=await navigator.wakeLock.request('screen')}catch(e){}
  clearInterval(kTimer);kTimer=setInterval(kLoop,1200);
}
async function kLoop(){
  if(!kOn||kBusy||Date.now()<kCool)return;
  const v=$('#kv');if(!v||!v.videoWidth)return;
  if(!faceReady){setK(faceState==='loading'?'loading':'noengine');return}
  if(!db.staff.some(s=>s.desc)){setK('nofaces');return}
  kBusy=true;
  try{
    const det=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
    if(!det){kLast={sid:null,n:0};kUnk=0;if(kState!=='in'&&kState!=='already'&&kState!=='unknown')setK('look');return}
    let m=null,best=9;
    db.staff.forEach(s=>{if(s.desc){const x=faceapi.euclideanDistance(det.descriptor,s.desc);if(x<best){best=x;m=s}}});
    if(m&&best<=0.45){
      kUnk=0;
      if(kLast.sid===m.id)kLast.n++;else kLast={sid:m.id,n:1};
      if(kLast.n>=2){kLast={sid:null,n:0};if(kMode==='out')kOutIn(m);else kMark(m,v)}
    }else{
      kLast={sid:null,n:0};kUnk++;
      if(kUnk>=3){kUnk=0;kCool=Date.now()+2500;setK('unknown')}
    }
  }catch(e){}finally{kBusy=false}
}
function kMark(m,v){
  const T=today(),a=attOf(m.id,T);
  kCool=Date.now()+4000;
  if(a&&a.type!=='L'){setK('already',m,a.time||nowHM());return}
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  const tm=nowHM();
  db.att=db.att.filter(x=>!(x.sid===m.id&&x.date===T));db.att.push({id:uid(),sid:m.id,date:T,type:'P',time:tm,photo:thumb(c,160)});
  save();setK('in',m,tm);announce([{t:'in',sid:m.id,time:tm}],true);
}
function openKiosk(){
  if(!db.staff.length){toast(t('addStaffFirst'));return}
  kOn=true;kMode='att';kState='';kLast={sid:null,n:0};kUnk=0;kCool=0;
  const el=document.createElement('div');el.id='kiosk';
  el.innerHTML=`<div class="k-top"><button class="k-exit" onclick="closeKiosk()">${ic('chL',18)} ${t('kExit')}</button><div class="k-clock" id="kclk"></div></div><div class="k-stage"><div class="seg" style="margin:0"><button id="km1" class="on P" onclick="setKMode('att')">${t('kModeIn')}</button><button id="km2" onclick="setKMode('out')">${t('kModeOut')}</button></div><div class="vbox"><video id="kv" autoplay playsinline muted></video><div class="oval"></div></div><div class="k-card" id="kcard"></div></div><div class="k-foot" id="kfoot"></div>`;
  document.body.appendChild(el);
  const tick=()=>{const e=$('#kclk');if(e)e.innerHTML='<b>'+fmtT(nowHM())+'</b>'+longDate(today())};
  tick();clearInterval(kClk);kClk=setInterval(tick,1000);
  startKiosk();
}
function closeKiosk(){
  kOn=false;clearInterval(kTimer);clearInterval(kClk);clearTimeout(kRev);kStop();
  try{if(kWake)kWake.release()}catch(e){}
  kWake=null;const el=$('#kiosk');if(el)el.remove();render();
}

const SBK=['staff','att','pay','out'];
function sbCfg(){try{return JSON.parse(localStorage.getItem('sb_cfg')||'null')}catch(e){return null}}
function sbSave(c){try{localStorage.setItem('sb_cfg',JSON.stringify(c))}catch(e){}try{if(c.url&&c.key){const k=JSON.parse(localStorage.getItem('sb_keep')||'null')||{};localStorage.setItem('sb_keep',JSON.stringify({url:c.url,key:c.key,email:c.email||k.email||''}))}}catch(e){}}
function canon(v){
  if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
function hashStr(s){let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return String(x>>>0)}
function payloadOf(kind,r){if(kind==='att'){const o=Object.assign({},r);delete o.photo;return o}return r}
const sidOf=(k,r)=>k==='staff'?r.id:(r.sid||null);
function faceIndex(){const m={};db.staff.filter(s=>!s.left||s.left>=today()).forEach(s=>{const data={id:s.id,name:s.name,g:s.gender||'M',ds:s.dutyStart||'',de:s.dutyEnd||'',lg:s.lateGrace==null?10:s.lateGrace,photo:s.photo||null,desc:s.desc||null};m['f_'+s.id]={sid:s.id,data,h:hashStr(canon(data))}});return m}
function localIndex(){const m={};SBK.forEach(k=>db[k].forEach(r=>{m[r.id]={k,r,h:hashStr(canon(payloadOf(k,r)))}}));return m}
function dedupeAtt(){
  const seen={};let ch=false;
  db.att.slice().sort((a,b)=>a.id<b.id?1:-1).forEach(a=>{const k=a.sid+'|'+a.date;if(seen[k]){db.att=db.att.filter(x=>x.id!==a.id);ch=true}else seen[k]=1});
  return ch;
}
async function sbAuthCall(c,grant,body){
  const r=await fetch(c.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||('auth '+r.status));
  c.session={access:j.access_token,refresh:j.refresh_token,exp:Math.floor(Date.now()/1000)+(j.expires_in||3600)};
}
async function sbAuth(c,email,password){await sbAuthCall(c,'password',{email,password});c.email=email}
async function sbEnsure(c){
  if(!c.email)return;
  if(c.session&&c.session.exp>Date.now()/1000+60)return;
  const relog=()=>{c.email='';c.session=null;sbSave(c);try{render()}catch(_){}};
  if(!c.session||!c.session.refresh){relog();throw new Error('Sign in again')}
  try{await sbAuthCall(c,'refresh_token',{refresh_token:c.session.refresh});sbSave(c)}
  catch(e){const m=String((e&&e.message)||e);if(/refresh|invalid|expired|revoked|not found|jwt/i.test(m)&&!/fetch|network|load failed/i.test(m))relog();throw e}
}
async function sbReq(c,path,o){
  o=o||{};
  const hd=Object.assign({apikey:c.key,Authorization:'Bearer '+(c.session?c.session.access:c.key),'Content-Type':'application/json'},o.headers||{});
  const r=await fetch(c.url+path,{method:o.method||'GET',headers:hd,body:o.body});
  if(!r.ok){let m='';try{const j=await r.json();m=j.message||j.hint||JSON.stringify(j)}catch(e){}throw new Error(r.status+' '+m)}
  const tx=await r.text();return tx?JSON.parse(tx):null;
}
let syncing=false,syncMsg='',syncT=null;
function setSyncMsg(m){syncMsg=m;if(tab==='set')render()}
function schedSync(){const c=sbCfg();if(!c||!c.auto||syncing)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),2500)}
async function syncNow(manual){
  const c=sbCfg();if(!c||!c.url||!c.key||syncing)return;
  syncing=true;setSyncMsg(t('cloudSyncing'));
  try{
    await sbEnsure(c);
    const base=c.base||{};let changed=false,maxU=c.lastPull||'';
    const since=c.lastPull?new Date(Date.parse(c.lastPull)-10000).toISOString():'1970-01-01T00:00:00Z';
    const rows=[];
    for(let off=0;;off+=500){
      const page=await sbReq(c,'/rest/v1/records?select=*&updated_at=gt.'+encodeURIComponent(since)+'&order=updated_at.asc,id.asc&limit=500&offset='+off);
      rows.push(...page);if(page.length<500)break;
    }
    const idx=localIndex(),evs=[],fresh=r=>!!c.lastPull&&(Date.now()-Date.parse(r.updated_at))<15*60*1000;
    rows.forEach(r=>{
      if(r.updated_at>maxU)maxU=r.updated_at;
      const k=r.kind;if(!SBK.includes(k))return;
      const loc=idx[r.id],b=base[r.id];
      if(r.deleted){
        if(loc&&b&&loc.h===b[1]){db[k]=db[k].filter(x=>x.id!==r.id);delete idx[r.id];changed=true;base[r.id]=[k,'del']}
        else if(!loc)base[r.id]=[k,'del'];
        return;
      }
      const rec=Object.assign({},r.data||{});rec.id=r.id;
      const rh=hashStr(canon(payloadOf(k,rec)));
      if(!loc){
        if(b&&b[1]!=='del')return;
        if(fresh(r)){
          if(k==='att'&&rec.date===today()&&(rec.type==='P'||rec.type==='H'))evs.push({t:'in',sid:rec.sid,time:rec.time||''});
          if(k==='out'&&rec.date===today())evs.push(rec.in?{t:'back',sid:rec.sid,dur:durMin(rec.out,rec.in)}:{t:'out',sid:rec.sid,time:rec.out});
        }
        db[k].push(rec);changed=true;base[r.id]=[k,rh,sidOf(k,rec)];idx[r.id]={k,r:rec,h:rh};return;
      }
      if(loc.h===rh){base[r.id]=[k,rh,sidOf(k,rec)];return}
      if(b&&loc.h!==b[1]&&rh===b[1])return;
      if(fresh(r)&&k==='out'&&!loc.r.in&&rec.in)evs.push({t:'back',sid:rec.sid,dur:durMin(rec.out,rec.in)});
      const nr=k==='att'?Object.assign({},rec,{photo:loc.r.photo||null}):rec;
      const i=db[k].findIndex(x=>x.id===r.id);if(i>=0)db[k][i]=nr;
      base[r.id]=[k,rh,sidOf(k,rec)];idx[r.id]={k,r:nr,h:rh};changed=true;
    });
    if(dedupeAtt())changed=true;
    if(evs.length)announce(evs.slice(0,5));
    const idx2=localIndex(),fidx=faceIndex(),up=[];
    for(const id in idx2){const e=idx2[id],b=base[id];if(!b||b[1]!==e.h||b[2]===undefined)up.push({id,kind:e.k,sid:sidOf(e.k,e.r),data:payloadOf(e.k,e.r),deleted:false,_h:e.h})}
    for(const id in fidx){const e=fidx[id],b=base[id];if(!b||b[1]!==e.h)up.push({id,kind:'face',sid:e.sid,data:e.data,deleted:false,_h:e.h})}
    for(const id in base){const b=base[id];if(b[1]!=='del'&&!idx2[id]&&!fidx[id])up.push({id,kind:b[0],sid:b[2]||null,data:{},deleted:true})}
    for(let i=0;i<up.length;i+=200){
      await sbReq(c,'/rest/v1/records?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(up.slice(i,i+200).map(u=>({id:u.id,kind:u.kind,sid:u.sid,data:u.data,deleted:u.deleted})))});
    }
    up.forEach(u=>{base[u.id]=[u.kind,u.deleted?'del':u._h,u.sid]});
    c.base=base;c.lastPull=maxU;c.last=new Date().toISOString();sbSave(c);
    if(changed){persist();render()}
    syncing=false;setSyncMsg('');if(manual)toast(t('cloudDone'));
  }catch(e){syncing=false;setSyncMsg(t('cloudFail',{e:e.message}));if(manual)toast(t('cloudFail',{e:e.message}))}
}

function sbDefault(){
  const w=window.SB||{};
  if(w.url&&w.key&&!/XXXX|\.\.\./.test(w.url+w.key))return{url:w.url,key:w.key};
  try{const k=JSON.parse(localStorage.getItem('sb_keep')||'null');if(k&&k.url&&k.key)return{url:k.url,key:k.key}}catch(e){}
  return null;
}
function needLogin(){const c=sbCfg();if(c&&c.url&&c.key&&c.email)return false;try{if(sessionStorage.getItem('lg_skip')==='1')return false}catch(e){}return true}
function loginGate(){
  let el=document.getElementById('login');
  if(!needLogin()){if(el)el.remove();return}
  if(el&&el.getAttribute('data-l')===lang)return;
  if(el)el.remove();
  const d=sbDefault(),c=sbCfg()||{};let keep={};try{keep=JSON.parse(localStorage.getItem('sb_keep')||'null')||{}}catch(e){}
  el=document.createElement('div');el.id='login';el.setAttribute('data-l',lang);
  el.style.cssText='position:fixed;inset:0;z-index:300;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch';
  el.innerHTML=`<div style="min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:430px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 56px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)">
  <button class="navbtn" style="position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px)" onclick="toggleLang()">${ic('globe',18)}<span>${lang==='en'?'EN':'हिं'}</span></button>
  <div style="background:#fff;border-radius:28px;padding:14px 14px 10px;box-shadow:0 10px 34px rgba(0,0,0,.14);margin:0 0 22px"><img src="${LOGIN_LOGO}" alt="" style="width:100%;height:auto;display:block;border-radius:18px"></div>
  <h1 style="font-size:27px;margin:0 0 4px;text-align:center">${t('loginTitle')}</h1>
  <div class="sub" style="text-align:center;margin-bottom:18px">${t('loginSub')}</div>
  <div class="list">
   <div class="frow"><label>${t('loginEmail')}</label><input id="lgE" type="email" autocomplete="username" autocapitalize="off" autocorrect="off" value="${esc(c.email||keep.email||'')}" onkeydown="if(event.key==='Enter')$('#lgP').focus()"></div>
   <div class="frow"><label>${t('cloudPass')}</label><input id="lgP" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button type="button" style="border:0;background:none;color:var(--blue);font:inherit;font-weight:600;padding:0 0 0 10px" onclick="const p=$('#lgP');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'${t('loginShow')}':'${t('loginHide')}'">${t('loginShow')}</button></div>
  </div>
  ${d?'':`<div style="background:rgba(255,149,0,.14);color:var(--orange);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px;line-height:1.45">${t('loginNoCfg')}</div>`}
  <div id="lgErr" style="color:var(--red);font-size:14px;text-align:center;min-height:20px;margin-top:10px"></div>
  <button id="lgBtn" class="btn pri" style="width:100%;margin-top:4px;padding:15px;font-size:18px" onclick="doLogin()">${t('loginBtn')}</button>
  <button style="border:0;background:none;color:var(--sub,#8e8e93);font:inherit;font-size:13px;margin:14px auto 0;display:block" onclick="try{sessionStorage.setItem('lg_skip','1')}catch(e){}loginGate()">${t('loginSkip')}</button>
  </div>`;
  document.body.appendChild(el);
}
async function doLogin(){
  const em=$('#lgE').value.trim(),pw=$('#lgP').value,err=$('#lgErr'),btn=$('#lgBtn');
  const d=sbDefault();
  let url=(d?d.url:'').trim().replace(/\/+$/,''),key=(d?d.key:'').trim();
  err.textContent='';
  if(!url||!key){err.textContent=t('loginNoCfg');return}
  if(!em||!pw){err.textContent=t('loginNeed');return}
  if(!/^https?:\/\//.test(url))url='https://'+url;
  btn.disabled=true;btn.textContent=t('loginWait');
  const old=sbCfg()||{},same=old.url===url;
  const c={url,key,email:'',session:null,base:same?(old.base||{}):{},lastPull:same?(old.lastPull||''):'',auto:old.auto!==false,last:same?(old.last||''):''};
  try{
    await sbAuth(c,em,pw);
    await sbReq(c,'/rest/v1/records?select=id&limit=1');
  }catch(e){
    const m=String((e&&e.message)||e);
    err.textContent=/invalid login|credentials|invalid_grant/i.test(m)?t('loginWrong'):/records|relation|PGRST|404/.test(m)?t('cloudNoTable'):/fetch|network|load failed/i.test(m)?t('loginNet'):t('cloudFail',{e:m});
    btn.disabled=false;btn.textContent=t('loginBtn');return;
  }
  sbSave(c);try{sessionStorage.removeItem('lg_skip')}catch(e){}
  loginGate();render();syncNow(true);
}

/* ---------- Alerts: sound, voice, banner, phone notification ---------- */
let audioCtx=null;
function unlockAudio(){try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(C)audioCtx=new C()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
const al=()=>Object.assign({sound:true,voice:true,notify:true},cfg.alerts||{});
function setAl(k,v){cfg.alerts=Object.assign(al(),{[k]:!!v});saveCfg();unlockAudio();if(k==='notify'){if(v)askNotify().then(()=>pushEnable(true));else pushOff()}}
async function askNotify(){try{if(!('Notification' in window))return;if(Notification.permission==='default')await Notification.requestPermission();if(Notification.permission==='denied')toast(t('alDenied'))}catch(e){}}
function chime(kind){
  if(!al().sound)return;
  try{unlockAudio();if(!audioCtx)return;
    const seq=kind==='out'?[[659,0],[494,.16]]:kind==='back'?[[523,0],[659,.14],[784,.28]]:[[784,0],[988,.16]],t0=audioCtx.currentTime;
    seq.forEach(([f,d])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.35,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.32);o.connect(g);g.connect(audioCtx.destination);o.start(t0+d);o.stop(t0+d+.34)});
  }catch(e){}
}
function speak(txt){if(!al().voice||!('speechSynthesis' in window))return;try{const u=new SpeechSynthesisUtterance(txt);u.lang=lang==='hi'?'hi-IN':'en-IN';u.rate=.95;window.speechSynthesis.speak(u)}catch(e){}}
function durWords(n){const h=Math.floor(n/60),m=n%60;if(lang==='hi')return (h?h+' घंटे ':'')+((m||!h)?m+' मिनट':'');return (h?h+(h>1?' hours ':' hour '):'')+((m||!h)?m+(m===1?' minute':' minutes'):'')}
function alertMsg(ev){
  const s=db.staff.find(x=>x.id===ev.sid),n=s?s.name:'—',g=s&&s.gender,tm=ev.time?fmtT(ev.time):'';
  if(ev.t==='in')return{text:t('alIn',{n,t:tm})+lateSfx(s,ev.time),say:t('sIn',{n}),icon:'check',col:'#34c759'};
  if(ev.t==='out')return{text:tg('alOut',{n,t:tm},g),say:tg('sOut',{n},g),icon:'out',col:'#ff9500'};
  return{text:tg('alBack',{n,d:fmtDur(ev.dur||0)},g),say:tg('sBack',{n,d:durWords(ev.dur||0)},g),icon:'chL',col:'#007aff'};
}
let alertLog=[];try{alertLog=JSON.parse(localStorage.getItem('alert_log')||'[]')}catch(e){}
function logAlert(ev,text){alertLog.unshift({at:Date.now(),t:ev.t,text});alertLog=alertLog.slice(0,40);try{localStorage.setItem('alert_log',JSON.stringify(alertLog))}catch(e){}}
function showAlertBar(m){
  const d=document.createElement('div');d.className='alertbar';d.innerHTML=`<div class="ai" style="background:${m.col}">${ic(m.icon,20)}</div><div><b>${esc(biz().name)}</b><span>${esc(m.text)}</span></div>`;
  d.onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),7000);
}
function osNotify(m,ev){
  try{
    if(!document.hidden||pushOn()||!al().notify||!('Notification' in window)||Notification.permission!=='granted')return;
    const opt={body:m.text,icon:LOGO_MARK,tag:'att-'+ev.sid+ev.t,renotify:true,vibrate:[200,100,200]};
    navigator.serviceWorker.getRegistration().then(r=>{if(r&&r.showNotification)r.showNotification(biz().name,opt);else new Notification(biz().name,opt)});
  }catch(e){}
}
function announce(evs,local){
  evs.forEach((ev,i)=>{
    const m=alertMsg(ev);logAlert(ev,m.text);
    setTimeout(()=>{showAlertBar(m);chime(ev.t);setTimeout(()=>speak(m.say),350);if(!local)osNotify(m,ev)},i*2500);
  });
}

}

async function pushCall(path,o){const c=sbCfg();if(!c||!c.url||!c.key)throw new Error('no cloud');await sbEnsure(c);return sbReq(c,path,o)}
const PUSH_WANT=()=>al().notify;

/* ---------- Web Push: notification even when the app is closed ---------- */
const PUSH_KEY=(window.SB&&window.SB.vapid)||'BCAD7Hz6gAygJLkqfCsFX9eDju60knacxv9G9pdeBHplL_1JQ2Nl8jfmV59Imm0C6QYs2qgfWuhpN8cOQqaqfdE';
const pushOn=()=>{try{return localStorage.getItem('push_on')==='1'}catch(e){return false}};
const pushSet=v=>{try{localStorage.setItem('push_on',v?'1':'0')}catch(e){}};
function pushKey(s){const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function pushEnable(show){
  const say=m=>{if(!show)return;try{if(typeof toast==='function')toast(m);else showBar({text:m,glyph:'!',col:'#ff9500'})}catch(_){}};
  try{
    if(!PUSH_KEY||!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){say('Push not supported in this browser');return false}
    if(Notification.permission!=='granted'){say('Notification permission not allowed');return false}
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushKey(PUSH_KEY)});
    const j=sub.toJSON();
    await pushCall('/rest/v1/rpc/save_push_sub',{method:'POST',body:JSON.stringify({p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_lang:lang==='hi'?'hi':'en'})});
    pushSet(true);say('Push enabled ✓');return true;
  }catch(e){say('Push error: '+((e&&e.message)||e));return false}
}
async function pushOff(){
  try{
    pushSet(false);
    const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){const ep=sub.endpoint;await sub.unsubscribe();try{await pushCall('/rest/v1/rpc/remove_push_sub',{method:'POST',body:JSON.stringify({p_endpoint:ep})})}catch(e){}}
  }catch(e){}
}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='push-refresh'){try{syncNow()}catch(_){}}});
addEventListener('load',()=>setTimeout(()=>{try{if(PUSH_KEY&&('Notification' in window)&&Notification.permission==='granted'&&PUSH_WANT())pushEnable()}catch(e){}},4000));

const appBase=()=>location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/,'');
const CODE_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){const a=new Uint32Array(8);(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.floor(Math.random()*4e9))}).getRandomValues(a);let s='';for(let i=0;i<8;i++)s+=CODE_ALPHA[a[i]%32];return s}
async function makeInvite(role,sid){

  try{await sbEnsure(c);const code=newCode();await sbReq(c,'/rest/v1/invites',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({code,role,sid:sid||null})});return code}
  catch(e){toast(t('teamFail',{e:e.message}));return null}
}

async function reqSheet(){
  const c=sbCfg();
  if(!c||!c.url){sheet(t('reqAcc'),`<div class="empty" style="padding:20px 6px">${t('teamNeedCloud')}</div>`,{left:t('close')});return}
  sheet(t('reqAcc'),`<div class="empty">...</div>`,{left:t('close')});
  try{
    await sbEnsure(c);
    const rows=await sbReq(c,'/rest/v1/access_requests?select=*&status=eq.pending&order=created_at.desc')||[];
    const body=rows.length?rows.map(r=>{const s=db.staff.find(z=>z.id===r.sid);const who=r.role==='staff'?(s?s.name:'?'):(r.label||t('punchApp'));

async function reqAct(uid,ok){
  const c=sbCfg();
  try{
    await sbEnsure(c);
    if(ok)await sbReq(c,'/rest/v1/rpc/approve_request',{method:'POST',body:JSON.stringify({p_user:uid})});
    else await sbReq(c,'/rest/v1/access_requests?user_id=eq.'+uid,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'rejected'})});
    reqSheet();
  }catch(e){toast(t('teamFail',{e:e.message}))}
}

["2. रोज़ की हाज़िरी",["उपस्थिति टैब: ऊपर से तारीख चुनें। हर स्टाफ कार्ड में चेहरे से हाज़िरी, राशि लें और चार बटन हैं: उपस्थित, आधा दिन, छुट्टी, अनुपस्थित।","पहचानें और हाज़िरी लगाएँ एक चेहरा स्कैन करके स्टाफ को खुद ढूँढ लेता है।","बाहर गया / वापस आया से बाहर जाने और लौटने का समय दर्ज होता है। बाहर जाना जोड़ें से समय हाथ से भर सकते हैं।","लाल संख्या वाला रसीद आइकन उस दिन की राशि और बाहर जाने की प्रविष्टियाँ खोलता है। गलत प्रविष्टि वहीं हटा सकते हैं।","जो हटाते हैं वह 90 दिन तक सेटिंग्स > रीसायकल बिन में रहता है।"]],
["3. कियोस्क मोड और पंच ऐप",["कियोस्क मोड इस फोन को दरवाज़े का स्कैनर बना देता है: आने पर हाज़िरी टैब, बाहर जाने पर बाहर / वापसी टैब। इसके लिए https, कैमरा अनुमति और चेहरा मिलान चालू होना चाहिए।","अलग दरवाज़े वाले फोन के लिए पंच ऐप (punch.html) है: उसमें सिर्फ चेहरे से हाज़िरी और बाहर / वापसी होती है, वेतन नहीं दिखता।","उसका कोड सेटिंग्स > टीम ऐप्स में बनाएँ।"]],
["4. वेतन के नियम",["दैनिक दर = मासिक वेतन ÷ 30 (हर महीने के लिए तय), दशमलव छोड़कर (₹11,000 ÷ 30 = ₹366)।","अनुपस्थिति पर कटौती (हर स्टाफ के लिए): एक अनुपस्थित दिन पर एक दैनिक दर कटती है, आधे दिन पर आधी। छुट्टी का वेतन मिलता है।","पूरा महीना बिना किसी छुट्टी के काम करने पर 34 दिन का वेतन मिलता है (34 × दैनिक दर)। संख्या 'बिना छुट्टी पर भुगतान दिन' में बदलें; 0 से बंद।","1 माह बाद भुगतान: नए स्टाफ का वेतन काम शुरू से एक माह बाद देय होता है।","जो महीने के बीच में जुड़े, उसे उस महीने के दिनों के हिसाब से वेतन मिलता है।","राशि लें = दिया गया कोई भी पैसा। वह पहले पुराने बकाये में, फिर इस महीने में घटता है। लाल 'अधिक लिया' का मतलब कमाई से ज़्यादा दिया गया।"]],
["5. वेतन और रिपोर्ट",["वेतन टैब: महीना चुनें। हर कार्ड में वेतन, बोनस, कटौती और शेष दिखता है। दैनिक विवरण में हर दिन की सूची है।","हाज़िरी शीट: दिन पर टैप करने से उपस्थित > आधा > छुट्टी > अनुपस्थित बदलता है। पुराने कागज़ी रिकॉर्ड भरने के लिए अच्छा है।","रिपोर्ट टैब: दिन या तारीख सीमा चुनें, फिर स्टाफ का नाम खोजकर उसकी रिपोर्ट खोलें।","WhatsApp आइकन रिपोर्ट कार्ड की तस्वीर बनाकर शेयर मेन्यू खोलता है: WhatsApp चुनें, फिर व्यक्ति को।"]],
["6. स्टाफ ऐप, अलर्ट और क्लाउड",["स्टाफ ऐप (staff.html): हर स्टाफ सिर्फ अपनी हाज़िरी, पैसा और शेष देखता है। वह कुछ बदल नहीं सकता। स्टाफ के पेज में 'स्टाफ ऐप एक्सेस' से कोड बनाएँ और लिंक WhatsApp पर भेजें।","दोनों ऐप और यह ऐप क्लाउड सिंक (Supabase) से डेटा साझा करते हैं। पहले इस फोन को जोड़ें, फिर SQL एक बार चलाएँ।","जब कोई हाज़िरी लगाता है, बाहर जाता है या लौटता है, तो यह ऐप बैनर दिखाता है, आवाज़ बजाता है और नाम बोलता है। ऐप बैकग्राउंड में हो तो फोन नोटिफिकेशन भी आता है। ऐप खुला या बैकग्राउंड में होना चाहिए; पूरी तरह बंद ऐप में अभी अलर्ट नहीं आ सकते।"]],
["7. बैकअप और सुरक्षा",["सेटिंग्स > अभी बैकअप लें: हर हफ्ते फ़ाइल डाउनलोड करके Google Drive में रखें।","बैकअप फ़ाइल से रीस्टोर करने पर मौजूदा डेटा बदल जाता है। पिछला रीस्टोर वापस लें से पहले का डेटा लौट आता है।","डेटा हर वेब पते और हर फोन में अलग रहता है। इंस्टॉल किया ऐप और ब्राउज़र टैब का डेटा अलग हो सकता है।"]],
["8. कुछ गड़बड़ हो तो",["सफेद या अटकी स्क्रीन: आपका-साइट/reset.html खोलें, बटन 1 और फिर 3 दबाएँ। डेटा सुरक्षित रहता है।","कैमरा नहीं खुल रहा: https लिंक से खोलें, कैमरा अनुमति दें, या फोन कैमरा चुनें।","सेटिंग्स > ऐप रिफ्रेश करें सेव की हुई कॉपी हटाकर नया वर्ज़न लाता है।"]]
]};

const GUIDE2={"en": {"owner": [["1. Getting started", ["Settings > Business: check the restaurant name, place and phone. They appear on reports.", "Staff tab > + : add each staff member with name, gender (Male/Female), mobile number, monthly salary and a face photo (look straight at the camera).", "Working Since = the day the person really started. Previous Salary Due = unpaid salary from before this month. Enter it once; the app adds the rest by itself.", "Install: Android Chrome > menu > Install App. iPhone: Safari > Share > Add to Home Screen."]], ["2. Daily attendance", ["Attendance tab: pick the date at the top. Each staff card has Face Check-In, Withdraw and four buttons: Present, Half Day, Leave, Absent.", "Identify & Check In scans one face and finds the staff member by itself.", "Mark Out / Mark Back records when a person goes outside and returns. Add Outing lets you type the times.", "The receipt icon with a red number opens that day's money and outing entries. A wrong entry can be deleted there.", "Anything you delete goes to Settings > Recycle Bin for 90 days."]], ["3. Give money: Withdraw and Pay", ["Tap Withdraw on a staff card (Attendance or Pay tab). Enter amount, date and the month it belongs to.", "Payment mode: choose Cash or Online. For Online, write the UTR / transaction number in Note so you can match it later.", "The sheet shows the staff member's Remaining (or Overdrawn) before you save. Tap the arrow to fill the full remaining amount.", "Staff see this as 'Received' with a green + sign in their own app and get a phone notification.", "Wrong entry: Pay tab > open the staff card > Details > bin icon."]], ["4. Salary rules", ["Daily rate = monthly salary / 30 (fixed for every month), rounded down (Rs 11,000 / 30 = Rs 366).", "Deduct for Absence (per staff): an absent day cuts one daily rate, a half day cuts half. Leave is paid.", "A full month with no leave pays 34 days (change 'Paid days if no leave'; 0 turns it off).", "Pay After 1 Month: a new staff member's salary becomes payable one month after Working Since. Someone who joins mid-month is paid per day.", "Left work: open the staff member > Left work on (last day). That month is paid only up to that day. After it salary stops adding, and the remaining dues stay the same until you pay them. Clear the date to undo.", "Red Overdrawn means more money was given than earned (advance)."]], ["5. Pay tab and totals", ["Choose the month at the top. Each card shows salary, bonus, deductions, paid and Remaining / Overdrawn.", "Summary rows are tappable: Total withdrawn, Remaining and Overdrawn each open a list of every staff member with the amount.", "Remaining includes unpaid balance from earlier months, so it changes when you change the month.", "Attendance Sheet: tap a day to cycle Present > Half > Leave > Absent. Good for filling old records.", "The WhatsApp icon builds a report card picture and opens the share menu."]], ["6. Reports", ["Reports tab: pick a day or a date range, then search a staff name to open that person's report.", "Share Report sends the picture on WhatsApp.", "Use Pay tab > Daily Details to see every day of a month for one person."]], ["7. Give access to Staff and Punch apps", ["Settings > Team Apps has Install Staff app and Install Punch app: open the link, copy it or send it on WhatsApp. Then the phone installs it (Android: menu > Install App, iPhone: Share > Add to Home Screen).", "Staff opens the link, types their mobile number (it must match the number saved in the Staff tab) and sees a 4-digit code.", "Punch phone opens its link, types a phone name like 'Door phone' and also sees a 4-digit code.", "Settings > Team Apps > Access requests shows the request with the same 4-digit code. Match it with the person's phone and tap Approve (or Reject). Another way: create an access code (Staff tab > Staff App Access, or Team Apps > Punch app) and send the link with the code; it works once for 7 days.", "If a staff member left, set 'Left work on' - their face is removed from the Punch phone automatically."]], ["8. Alerts and notifications", ["Settings > Alerts: Sound, Voice, Phone notification and a Test button.", "When someone checks in, goes out or returns, this app shows a banner, plays a chime and speaks the name.", "Phone notifications also work when the app is fully closed. Turn the Phone notification switch ON once, tap Allow, and wait for 'Push enabled'.", "If notifications are late or missing: phone Settings > Apps > Chrome > Battery > Unrestricted, and turn off battery saver.", "You get alerts for check-ins done from the Punch phone, and a message when a new staff or phone asks for access."]], ["9. Backup, cloud and safety", ["Settings > Back Up Now: download a file every week and keep it in Google Drive.", "Restore from Backup File replaces the current data. Undo Last Restore brings the previous data back.", "Cloud Sync shares data between this app, the Staff app and the Punch app. Keep it connected.", "Deleted entries stay in Recycle Bin for 90 days."]], ["10. If something goes wrong", ["White or stuck screen: Settings > Refresh App, or open your-site/reset.html and press button 1, then 3. Your data stays.", "Camera not opening: use the https link and allow Camera.", "Notification not coming: check the steps in section 8. Make sure Phone notification is ON in all three apps.", "Wrong salary after a change: check Working Since, Left work on, Previous Salary Due and Hold salary on the staff page."]]], "staff": [["1. Getting access", ["The owner adds your mobile number in the Staff tab and sends you the Staff App link on WhatsApp.", "Open the link, type your mobile number and tap Request access.", "A 4-digit code appears. Show it to the owner. When the owner approves, your page opens by itself.", "Install it: Android Chrome > menu > Install App. iPhone: Safari > Share > Add to Home Screen.", "The Staff app only shows your own data. You cannot change anything."]], ["2. Main screen", ["Top: choose the month with the arrows. Today's status shows Present, Half Day, Leave, Absent or Not marked yet.", "The big card shows Remaining (money you still get) or Overdrawn (you took more than earned).", "Below it: monthly salary, no-leave bonus, deduction for absent days, pro-rated amount, and Previous pending or Previous advance.", "If your salary is on hold, it shows the date it becomes due."]], ["3. Dues and Advance", ["Dues (to receive): money the owner still has to give you.", "Advance (to return): money you got more than you earned.", "Received this month and Total received till now show how much money you have got.", "The note below tells which month's balance you are seeing."]], ["4. Attendance and Out / In", ["Attendance shows each day of the month in colours: Present, Half, Leave, Absent.", "Out / In lists every time you went outside, with the time you left, returned and how long you were out.", "'Out now' shows if you are currently outside."]], ["5. Money received", ["Every payment is listed with a green + amount, the date, whether it was Cash or Online, and any note.", "'Received' is money given as withdrawal or advance. 'Salary received' is salary paid.", "If your salary is settled, Remaining becomes zero."]], ["6. Alerts", ["At the bottom: Phone notification, Sound and Test alert.", "You get a notification when attendance is marked, money is received (Cash or Online) or an out/in is recorded.", "Turn Phone notification ON once and tap Allow. It works even when the app is closed.", "If late or missing: phone Settings > Apps > Chrome > Battery > Unrestricted."]], ["7. Language, offline and disconnect", ["Change language between English and Hindi from the language button.", "Offline: the app shows your last saved data and says 'Offline, showing saved data'. Tap Refresh when the internet is back.", "Disconnect this phone removes your access from this phone."]], ["8. Problems", ["'This number is not registered': ask the owner to add your number in the Staff tab.", "'No data found / access removed': ask the owner for a new link.", "Nothing updating: tap Refresh, check internet, then reopen the app."]]], "punch": [["1. Set up the door phone", ["The owner sends the Punch App link (Settings > Team Apps > Punch App).", "Open it on the door phone, type a phone name such as 'Door phone' and tap Request access.", "A 4-digit code appears. Show it to the owner. After approval the phone starts working.", "Allow Camera. The link must start with https. Install it on the home screen for full-screen use."]], ["2. Check-in", ["Open the Check-in tab. The staff member looks at the camera.", "The face is matched, attendance is marked as Present and the phone says 'Welcome <name>' with the time.", "If the person has already checked in it says 'Already checked in at ...'.", "The top bar shows how many staff are in today, for example '3 of 8 in today'."]], ["3. Out / In (going outside)", ["Open the Out / In tab and look at the camera.", "First time = Out. The time is recorded and the staff shows an OUT badge.", "Second time = Back. It records how long the person was outside and welcomes them back.", "Someone who has not checked in today is told so."]], ["4. Offline and sync", ["The badge shows Online or Offline. When there is no internet, punches are saved on the phone ('n waiting').", "They are sent automatically when internet returns. Tap Sync Now to send immediately."]], ["5. Settings", ["Tap the gear icon. If a PIN is set, enter it first.", "Language (English / Hindi), Sound, Voice and Test voice.", "Phone notification: alerts for attendance done on other devices.", "Settings PIN: set a 4-digit PIN so staff cannot change settings.", "Refresh App (Clear Cache) loads the newest version. Disconnect this phone removes access."]], ["6. Problems", ["'Face not recognised': look straight, make sure there is light, or ask the owner to register the face again.", "'No staff face is registered': the owner must add the face photo in the owner app.", "Camera not working: allow Camera and use the https link.", "A staff member who left (Left work on date) no longer appears on this phone."]]], "feat": [["Owner app", ["Daily attendance: Present, Half Day, Leave, Absent, with face check-in and photo proof.", "Staff list with photo, gender, mobile, salary, previous due, hold salary and Left work on date.", "Withdraw / Pay with Cash or Online mode and notes.", "Pay tab with Remaining, Overdrawn and Total withdrawn lists for every staff.", "Salary rules: daily rate, absence deduction, no-leave 34 days bonus, pay after 1 month, mid-month joining.", "Staff who left: salary stops, dues stay fixed.", "Out / In tracking with duration.", "Reports for a day or date range and WhatsApp report cards.", "Kiosk mode, Team Apps access with approval, Recycle Bin (90 days), Backup / Restore, Cloud Sync.", "Alerts: banner, sound, voice and phone notifications even when the app is closed.", "Hindi and English, and male / female wording in Hindi messages."]], ["Staff app", ["See your own attendance, salary, deductions and bonus month by month.", "Remaining / Overdrawn, Dues and Advance cards.", "Money received with Cash / Online and notes, shown as green +.", "Out / In history with times and duration.", "Phone notifications when attendance is marked, money is received or you go out / return.", "Works offline with saved data. Hindi and English."]], ["Punch app", ["Door phone with face attendance and Out / In.", "Greets by name with sound and voice, shows who is in today.", "Works offline and syncs later. Settings PIN to lock settings.", "Alerts for attendance done on other devices.", "Staff who left are removed automatically. Hindi and English."]], ["Common to all three apps", ["Cloud Sync keeps all phones updated.", "Phone notifications, even when the app is closed (after you allow them once).", "Install on the home screen like a normal app.", "Face matching, Hindi / English, offline use."]]]}, "hi": {"owner": [["1. शुरुआत", ["सेटिंग्स > let gTab='owner';
function guideOpen(tab){
  if(tab)gTab=tab;
  const G=GUIDE2[lang]||GUIDE2.en,names=[['owner',t('gOwner')],['staff',t('gStaff')],['punch',t('gPunch')],['feat',t('gFeat')]];
  const tabs=`<div class="gtabs">${names.map(n=>`<button class="${gTab===n[0]?'on':''}" onclick="guideOpen('${n[0]}')">${esc(n[1])}</button>`).join('')}</div>`;
  const body=G[gTab].map(g=>`<details class="gd"><summary>${esc(g[0])}</summary><div class="gb">${g[1].map(x=>`<div>${esc(x)}</div>`).join('')}</div></details>`).join('');
  sheet(t('guideTitle'),tabs+`<div class="list">${body}</div>`,{left:t('close')});
}

/* ---------- Shell ---------- */
function go(k){tab=k;window.scrollTo(0,0);render()}
function render(){
  try{loginGate()}catch(e){}
  const titles={att:t('att'),pay:t('pay'),rep:t('rep'),staff:t('staff'),set:t('settings')};
  $('#tabbar').innerHTML=['att','pay','rep','staff','set'].map(k=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${ic(TICON[k],26)}<span>${titles[k]}</span></button>`).join('');
  $('#navt').textContent=titles[tab];
  $('#navr').innerHTML=`<button class="navbtn" onclick="toggleLang()">${ic('globe',18)}<span>${lang==='en'?'EN':'हिं'}</span></button>`;
  const body=tab==='att'?viewAtt():tab==='pay'?viewPay():tab==='rep'?viewRep():tab==='set'?viewSet():viewStaff();
  $('#main').innerHTML=`${updateAvail?`<button class="card" style="width:100%;text-align:left;color:var(--blue);font-weight:600" onclick="resetApp()">${t('updateAvail')}</button>`:''}<div class="ltrow"><h1 class="lt">${titles[tab]}</h1>${tab==='staff'?`<button class="addbtn" onclick="addStaff()">${ic('plus',22)}</button>`:''}</div>${body}`;
  const mm=$('#main');if(mm&&mm.setAttribute)mm.setAttribute('data-ready','1');
  if(tab==='rep'&&!repSid)updateRepRes();
}
window.addEventListener('scroll',()=>$('#nav').classList.toggle('sc',window.scrollY>34),{passive:true});
document.documentElement.lang=lang;
function bootError(e){const m=$('#main');if(m&&m.setAttribute)m.setAttribute('data-ready','1');if(m)m.innerHTML=`<div class="card"><b>${t('bootFail')}</b><div class="sub" style="margin:6px 0 12px;word-break:break-word">${esc((e&&e.message)||e)}</div><button class="btn pri" style="width:100%" onclick="resetApp()">${t('resetCache')}</button></div>`}
try{applyTheme();render();initFace();setTimeout(checkUpdate,3000)}catch(e){bootError(e)}
</script>
