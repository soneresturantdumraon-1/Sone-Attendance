<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sone Punch">
<meta name="theme-color" content="#000000">
<title>Sone Punch</title>
<link rel="manifest" href="manifest-punch.json">
<link rel="icon" href="punch-192.png">
<link rel="apple-touch-icon" href="punch-192.png">
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--tx2:#8e8e93;--sep:rgba(60,60,67,.2);--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--fill:rgba(120,120,128,.12);--segon:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.65);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--fill:rgba(120,120,128,.24);--segon:#636366}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.65);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--fill:rgba(120,120,128,.24);--segon:#636366}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.35;cursor:default}
svg{display:block;flex:none}
.mu{color:var(--tx2)}.g{color:var(--green)}.o{color:var(--orange)}.r{color:var(--red)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin:0 0 12px}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;border-bottom:.5px solid var(--sep);color:var(--tx)}
.list>:last-child{border-bottom:0}
.frow{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:46px;border-bottom:.5px solid var(--sep)}
.frow label{min-width:110px;color:var(--tx)}
.frow input{flex:1;min-width:0;border:0;background:transparent;color:var(--tx);font:inherit;padding:12px 0;margin:0;outline:none;text-align:right}
.btn{height:46px;border-radius:12px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px}
.btn.pri{background:var(--blue);color:#fff}.btn.tint{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}.btn.red{background:var(--red);color:#fff}
.grow{flex:1;min-width:0}.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{font-size:13px;color:var(--tx2)}
.av{border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.tag.P{color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}.tag.H{color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent)}.tag.A{color:var(--tx2);background:var(--fill)}.tag.L{color:var(--blue);background:color-mix(in srgb,var(--blue) 16%,transparent)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:500}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.25);font-weight:700}
.tiles{display:flex;padding:12px 0}.tiles>div{flex:1;text-align:center;border-right:.5px solid var(--sep)}.tiles>div:last-child{border:0}
.tiles b{display:block;font-size:28px;font-weight:700;line-height:1.1}.tiles span{font-size:12px;color:var(--tx2)}
.irow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:.5px solid var(--sep)}.irow:last-child{border-bottom:0}.irow span{flex:1;min-width:0}.irow b{font-weight:600;white-space:nowrap}
.banner{border-radius:10px;padding:11px 12px;font-weight:600;font-size:14.5px;margin-top:10px}
.banner.g{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}.banner.r{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}.banner.n{background:var(--fill);color:var(--tx)}
.hd{font-size:13px;text-transform:uppercase;color:var(--tx2);margin:18px 16px 6px;letter-spacing:.2px}
.foot{font-size:13px;color:var(--tx2);margin:-6px 16px 12px}
.empty{text-align:center;color:var(--tx2);padding:30px 20px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);display:inline-block}.dot.ok{background:var(--green)}.dot.off{background:var(--red)}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:99px;background:rgba(120,120,128,.32);position:relative;transition:.2s;margin:0;flex:none;border:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.sw:checked{background:var(--green)}.sw:checked::after{transform:translateX(20px)}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30}
#sheetbg.show{display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--bg);color:var(--tx);width:100%;max-width:560px;border-radius:14px 14px 0 0;max-height:92%;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;position:sticky;top:0;background:var(--bg);z-index:2}.sh-t{font-weight:600}
.lnk{color:var(--blue);min-width:72px;text-align:left}.lnk.b{font-weight:600;text-align:right}
.sh-b{padding:4px 16px 22px}
.alertbar{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:70;max-width:560px;margin:0 auto;background:rgba(44,44,46,.97);color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:alertdown .3s}
.alertbar .ai{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.alertbar b{display:block;font-size:15px}.alertbar span{font-size:12px;color:#c7c7cc}
@keyframes alertdown{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom,0px));background:rgba(40,40,42,.95);color:#fff;padding:11px 18px;border-radius:99px;z-index:60;font-size:15px;font-weight:500;max-width:90%;text-align:center}
input.big{font-size:30px;font-weight:700;width:100%;text-align:center;border:0;background:transparent;color:var(--tx);outline:none;font-family:inherit;letter-spacing:4px}
.brand{display:flex;align-items:center;gap:10px}.brand img{height:42px;width:auto}.brand b{display:block;font-size:15px;letter-spacing:.4px}.brand span{font-size:12px;color:var(--tx2)}

html{background:#000}body{background:#000}
.pwrap{max-width:520px;margin:0 auto;padding:12px 14px 40px}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.pright{display:flex;align-items:center;gap:10px}.gear{color:var(--tx2);padding:6px}
#clk b{font-size:22px;font-weight:700}
.vbox{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;margin:12px 0}
.vbox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.oval{position:absolute;inset:10% 25%;border:2px dashed rgba(255,255,255,.75);border-radius:50%}
.k-card{min-height:108px;border-radius:18px;background:rgba(255,255,255,.1);padding:16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px}
.k-card.ok{background:rgba(52,199,89,.25)}.k-card.warn{background:rgba(255,149,0,.25)}.k-card.bad{background:rgba(255,69,58,.25)}
.kt{font-size:19px;font-weight:700}
</style>
</head>

<script>
/* ===== mobile-number access: request -> owner approves (config.js needed) ===== */
const SBC=(window.SB&&/^https?:\/\/[^X]/.test(window.SB.url||'')&&/^eyJ/.test(window.SB.key||''))?window.SB:null;
const ROLE_='kiosk';
const PL={en:{mobile:'Mobile number',device:'Phone name',send:'Request access',badNum:'Enter a valid 10 digit mobile number.',nf:'This number is not registered. Ask the owner to add your number in the Staff page.',showCode:'Show this code to the owner',waiting:'Waiting for owner approval...',cancel:'Cancel',hS:'Enter your mobile number. The owner will approve you.',hK:'Name this phone, for example Door phone. The owner will approve it.',rej:'The owner rejected this request.'},
hi:{mobile:'मोबाइल नंबर',device:'फ़ोन का नाम',send:'एक्सेस मांगें',badNum:'सही 10 अंकों का मोबाइल नंबर भरें।',nf:'यह नंबर दर्ज नहीं है। मालिक से स्टाफ पेज में अपना नंबर जुड़वाएँ।',showCode:'यह कोड मालिक को दिखाएँ',waiting:'मालिक की मंज़ूरी का इंतज़ार...',cancel:'रद्द करें',hS:'अपना मोबाइल नंबर भरें। मालिक आपको मंज़ूरी देंगे।',hK:'इस फ़ोन का नाम लिखें, जैसे Door phone। मालिक मंज़ूरी देंगे।',rej:'मालिक ने यह अनुरोध अस्वीकार किया।'}};
const pt=k=>(PL[lang]||PL.en)[k];
let polling=null;
function phonePart(){
  const q=cfg.req,st=ROLE_==='staff';
  if(q)return `<div class="card" style="text-align:center"><div class="sub">${pt('showCode')}</div><div style="font-size:46px;font-weight:800;letter-spacing:8px;margin:6px 0">${esc(q.vcode)}</div><div class="sub">${q.name?esc(q.name)+' · ':''}${pt('waiting')}</div></div><button class="btn tint" style="width:100%" onclick="reqCancel()">${pt('cancel')}</button>`;
  return `<div class="list"><div class="frow"><label>${st?pt('mobile'):pt('device')}</label><input id="phn" ${st?'inputmode="numeric" maxlength="15" placeholder="98XXXXXXXX"':'placeholder="Door phone"'} autocomplete="off"></div></div><button class="btn pri" id="pgo" style="width:100%" onclick="reqSend()">${pt('send')}</button><div id="pmsg" style="color:var(--red);font-size:14px;margin:8px 4px;min-height:18px">${window._rm||''}</div><div class="sub" style="padding:0 4px">${st?pt('hS'):pt('hK')}</div>`;
}
async function reqSend(){
  const v=$('#phn').value.trim(),m=$('#pmsg'),b=$('#pgo'),st=ROLE_==='staff';
  if(!v||(st&&v.replace(/\D/g,'').length<10)){m.textContent=pt('badNum');return}
  b.disabled=true;m.textContent='';window._rm='';
  try{
    cfg.url=SBC.url.replace(/\/+$/,'');cfg.key=SBC.key;
    if(!cfg.session)await authCall('signup',{data:{}});
    const r=await api('/rest/v1/rpc/request_access',{method:'POST',body:JSON.stringify({p_role:ROLE_,p_phone:st?v:null,p_label:st?null:v})});
    cfg.req={vcode:r.vcode,name:r.name||''};cfg.role=null;saveCfg();render();reqPoll();
  }catch(e){m.textContent=/NUMBER_NOT_FOUND/.test(e.message)?pt('nf'):e.message;b.disabled=false}
}
function reqCancel(){clearInterval(polling);cfg.req=null;saveCfg();render()}
function reqPoll(){
  clearInterval(polling);
  const tick=async()=>{
    if(!cfg.req||!cfg.session)return;
    try{
      const a=await api('/rest/v1/rpc/my_access',{method:'POST',body:'{}'});
      if(a.status==='approved'&&a.role===ROLE_){
        clearInterval(polling);cfg.role=a.role;cfg.sid=a.sid||null;cfg.name=a.name||null;cfg.req=null;saveCfg();
        if(ROLE_==='staff'){D={staff:null,att:[],pay:[],out:[],at:''};render();pull()}
        else{S={faces:{},att:{},outs:{},since:'',queue:[]};persist();render();syncAll()}
      }else if(a.status==='rejected'||a.status==='none'||a.status==='approved'){
        clearInterval(polling);cfg.req=null;saveCfg();window._rm=a.status==='rejected'?pt('rej'):'';render();
      }
    }catch(e){}
  };
  polling=setInterval(tick,4000);tick();
}
addEventListener('load',function(){if(SBC&&cfg.req&&cfg.session&&cfg.role!==ROLE_)reqPoll()});
</script>
<script>
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e&&e.message)||'error')});
  window.addEventListener('unhandledrejection',function(e){errs.push(String((e&&e.reason&&e.reason.message)||(e&&e.reason)||'rejection'))});
  window.resetApp=function(){
    var jobs=[];
    try{if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}))}catch(e){}
    try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}))}catch(e){}
    var go=function(){location.replace(location.pathname+'?v='+Date.now())};Promise.all(jobs).then(go,go);
  };
  setTimeout(function(){
    var m=document.getElementById('app');
    if(m&&m.getAttribute('data-ready')!=='1'){
      m.innerHTML='<div style="margin:24px 16px;padding:18px;background:#fff;color:#111;border-radius:14px;font:16px system-ui,sans-serif"><b>The app could not start</b><div style="color:#8e8e93;margin:8px 0 14px;font-size:14px;word-break:break-word">'+(errs.length?errs.join(' | ').replace(/</g,'&lt;'):'Still loading. Check the internet and try again.')+'</div><button onclick="resetApp()" style="padding:12px 18px;border:0;border-radius:12px;background:#007aff;color:#fff;font-size:15px;font-weight:600">Refresh app (clear cache)</button></div>';
    }
  },4500);
})();

let mode='in',kState='',kRev=null,kBusy=false,kLast={sid:null,n:0},kUnk=0,kCool=0,stream=null,wake=null,timers=[];

function setK(st,sid,x){
  const el=$('#kcard');if(!el)return;
  if(st===kState&&['look','loading','noengine','nofaces','blink'].includes(st))return;
  kState=st;let cls='',h='';

  else if(st==='out'||st==='back'){cls='ok';h=`${av(f.name,f.photo,60)}<div style="text-align:left"><div class="kt">${st==='out'?tg('kOut',{n,t:fmtT(x)},f.g):tg('kBack',{n,d:x},f.g)}</div></div>`}
  else if(st==='notin'||st==='recent'){cls='warn';h=`${av(f.name,f.photo,60)}<div style="text-align:left;font-weight:600">${t(st==='notin'?'kNotIn':'kRecent',{n})}</div>`}
  else if(st==='over'){cls='bad';h=`${av(f.name,f.photo,60)}<div style="text-align:left;font-weight:600">${t('kOver',{n})}</div>`}
  else if(st==='unknown'){cls='bad';h=`<div class="kt">${t('unknown')}</div>`}
  else if(st==='blink'){cls='warn';h=`<div class="kt">${t('blink')}</div>`}
  else if(st==='noengine'){cls='warn';h=`<div><div>${t('noEngine')}</div><button class="btn pri" style="margin-top:10px" onclick="retryEngine()">${t('retry')}</button></div>`}
  else if(st==='nofaces'){cls='warn';h=`<div>${t('noFaces')}</div>`}
  else if(st==='cam'||st==='insecure'){cls='bad';h=`<div><div>${t(st==='cam'?'camErr':'insecure')}</div>${st==='cam'?`<button class="btn pri" style="margin-top:10px" onclick="startCam()">${t('retry')}</button>`:''}</div>`}
  else h=`<div class="kt">${st==='loading'?t('loadingEngine'):t('look')}</div>`;
  el.className='k-card '+cls;el.innerHTML=h;
  clearTimeout(kRev);if(['in','already','out','back','notin','recent','unknown','over'].includes(st))kRev=setTimeout(()=>{kState='';setK('look')},3800);
}

function updNet(){

function updList(){

function mount(){

async function loop(){
  if(kBusy||Date.now()<kCool||!cfg.session||cfg.role!=='kiosk')return;
  const v=$('#kv');if(!v||!v.videoWidth)return;
  if(!faceReady){setK(faceState==='loading'?'loading':'noengine');return}
  const withFace=Object.values(S.faces).filter(f=>f.desc);
  if(!withFace.length){setK('nofaces');return}
  kBusy=true;
  try{
    const det=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
    if(!det){kLast={sid:null,n:0};kUnk=0;if(!['in','already','out','back','notin','recent','unknown','over'].includes(kState))setK('look');return}
    let m=null,best=9;
    withFace.forEach(f=>{const x=faceapi.euclideanDistance(det.descriptor,f.desc);if(x<best){best=x;m=f}});
    if(m&&best<=0.45){
      kUnk=0;if(kLast.sid===m.id)kLast.n++;else kLast={sid:m.id,n:1};
      if(kLast.n>=2){kLast={sid:null,n:0};if(cfg.live===false)handleMatch(m.id);else await liveCheck(v,m)}
    }else{kLast={sid:null,n:0};kUnk++;if(kUnk>=3){kUnk=0;kCool=Date.now()+2500;setK('unknown')}}
  }catch(e){}finally{kBusy=false}
}
const earOf=p=>{const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);return(d(p[1],p[5])+d(p[2],p[4]))/(2*d(p[0],p[3]))};
/* blink detector: learns this person's open-eye level, then looks for a dip and a re-open (works for narrow eyes, glasses, slow cameras) */
function blinkDet(){
  const s=[];let lowAt=0,armed=true;
  return(e,now)=>{
    s.push(e);if(s.length>40)s.shift();
    if(s.length<4)return false;
    const so=s.slice().sort((x,y)=>x-y),base=so[Math.floor(so.length*0.8)];
    if(!lowAt){
      if(!armed){if(e>base*0.9)armed=true;return false}
      if(e<base*0.8&&base-e>0.035)lowAt=now;
      return false;
    }
    if(now-lowAt>1500){lowAt=0;armed=false;return false}
    return e>base*0.9;
  };
}
async function liveCheck(v,m){
  setK('blink');
  const opt=new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:0.4}),det=blinkDet(),end=Date.now()+7000;
  let ok=false,lost=0;
  try{
    while(Date.now()<end){
      const d=await faceapi.detectSingleFace(v,opt).withFaceLandmarks();
      if(d){lost=0;const l=d.landmarks,e=(earOf(l.getLeftEye())+earOf(l.getRightEye()))/2;if(det(e,Date.now())){ok=true;break}}
      else if(++lost>12)break;
      await new Promise(r=>setTimeout(r,40));
    }
    if(ok){
      for(let i=0;i<3&&!ok.done;i++){
        const f=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
        if(f&&faceapi.euclideanDistance(f.descriptor,m.desc)<=0.5){ok={done:true};break}
        await new Promise(r=>setTimeout(r,150));
      }
      if(ok&&ok.done){kCool=Date.now()+1500;handleMatch(m.id);return}
    }
  }catch(e){}
  kCool=Date.now()+700;kState='';setK('look');
}

}

const hasPin=()=>!!(cfg.pinH||cfg.pin);
const rndHex=()=>Array.from(crypto.getRandomValues(new Uint8Array(8))).map(x=>x.toString(16).padStart(2,'0')).join('');
async function pinHash(p,salt){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+p));return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function pinSave(p){cfg.pinS=rndHex();cfg.pinH=await pinHash(p,cfg.pinS);delete cfg.pin;saveCfg()}
function pinClear(){delete cfg.pin;delete cfg.pinH;delete cfg.pinS;cfg.pinF=0;cfg.pinL=0;saveCfg()}
async function pinOk(p){
  if(cfg.pinH)return(await pinHash(p,cfg.pinS))===cfg.pinH;
  if(cfg.pin&&p===cfg.pin){await pinSave(p);return true}
  return false;
}
function openSettings(){
  if(!hasPin()){settingsSheet();return}

  const i=$('#pin');i.focus();
  i.oninput=async()=>{
    if(i.value.length!==4)return;
    const w=Math.ceil(((cfg.pinL||0)-Date.now())/1000);
    if(w>0){$('#pm').textContent=t('pinLocked',{s:w});i.value='';return}
    if(await pinOk(i.value)){cfg.pinF=0;saveCfg();settingsSheet();return}
    cfg.pinF=(cfg.pinF||0)+1;
    if(cfg.pinF%5===0)cfg.pinL=Date.now()+Math.min(300,30*Math.pow(2,cfg.pinF/5-1))*1000;
    saveCfg();
    const w2=Math.ceil(((cfg.pinL||0)-Date.now())/1000);
    $('#pm').textContent=w2>0?t('pinLocked',{s:w2}):t('pinWrong');i.value='';
  };

<script>
/* PWA: service worker + install prompt */
(function(){
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(standalone)return;
  var KEY='punch_inst_hide',bar=null,dp=null,hi=document.documentElement.lang==='hi';
  function hide(){if(bar){bar.remove();bar=null}}
  function show(msg,btn,fn){
    try{if(localStorage.getItem(KEY)==='1')return}catch(e){}
    if(bar||!document.body)return;
    bar=document.createElement('div');
    bar.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;background:#1c1c1e;color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font:14px/1.3 system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.4)';
    bar.innerHTML='<span style="flex:1">'+msg+'</span>'+(btn?'<button id="pwaI" style="background:#0a84ff;color:#fff;border-radius:9px;padding:8px 14px;font-weight:600;border:0">'+btn+'</button>':'')+'<button id="pwaX" style="color:#98989f;font-size:22px;padding:0 4px;border:0;background:none">&times;</button>';
    document.body.appendChild(bar);
    document.getElementById('pwaX').onclick=function(){try{localStorage.setItem(KEY,'1')}catch(e){}hide()};
    if(btn)document.getElementById('pwaI').onclick=fn;
  }
  addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();dp=e;
    show(hi?'Punch App को फ़ोन पर इंस्टॉल करें':'Install Punch App on your phone',hi?'इंस्टॉल':'Install',function(){hide();dp.prompt();dp=null});
  });
  addEventListener('appinstalled',hide);
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))setTimeout(function(){
    show(hi?'इंस्टॉल: Safari में Share दबाएँ, फिर "Add to Home Screen"':'To install: tap Share in Safari, then "Add to Home Screen"',null);
  },2500);
})();
