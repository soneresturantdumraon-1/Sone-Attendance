<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--tx2:#8e8e93;--sep:rgba(60,60,67,.2);--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--fill:rgba(120,120,128,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.65);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--fill:rgba(120,120,128,.24)}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.65);--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--fill:rgba(120,120,128,.24)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.mu{color:var(--tx2)}.g{color:var(--green)}.o{color:var(--orange)}.r{color:var(--red)}.sub{font-size:13px;color:var(--tx2)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px}
.list{background:var(--card);border-radius:14px;overflow:hidden;margin:0 0 12px}
.frow{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:46px;border-bottom:.5px solid var(--sep)}
.frow:last-child{border-bottom:0}
.frow label{min-width:100px}
.frow input{flex:1;min-width:0;border:0;background:transparent;color:var(--tx);font:inherit;padding:12px 0;outline:none;text-align:right}
.btn{height:46px;border-radius:12px;padding:0 16px;display:flex;align-items:center;justify-content:center;font-weight:600;width:100%}
.btn.pri{background:var(--blue);color:#fff}
.btn.tint{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.btn.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.who{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.nm{font-weight:700;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.ic{width:38px;height:38px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:12px 0 0}
.seg button{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:6px;margin:0 0 12px}
.mbar button{width:44px;height:40px;font-size:22px;color:var(--blue)}
.mbar span{font-weight:600}
.tiles{display:flex;gap:8px;margin:0 0 12px}
.tiles div{flex:1;background:var(--card);border-radius:14px;padding:10px 4px;text-align:center}
.tiles b{display:block;font-size:24px}
.tiles span{font-size:12px;color:var(--tx2)}
.big{text-align:center;padding:6px 0 10px}
.big b{display:block;font-size:34px;line-height:1.1}
.irow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:.5px solid var(--sep)}
.irow:last-child{border-bottom:0}
.irow span{flex:1;min-width:0}
.irow b{font-weight:600;white-space:nowrap}
.sec{font-weight:700;margin:6px 0 8px}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.tag.P{color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}
.tag.H{color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent)}
.tag.L{color:var(--blue);background:color-mix(in srgb,var(--blue) 16%,transparent)}
.tag.A{color:var(--tx2);background:var(--fill)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{font-style:normal;font-size:11px;text-align:center;color:var(--tx2)}
.cal div{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:var(--fill);color:var(--tx2)}
.cal .P{background:var(--green);color:#fff}.cal .H{background:var(--orange);color:#fff}.cal .L{background:var(--blue);color:#fff}.cal .A{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}.cal .f{opacity:.35}.cal .t{outline:2px solid var(--tx);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--tx2)}
.leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px;background:var(--fill)}
.banner.g{background:color-mix(in srgb,var(--green) 14%,transparent)}.banner.r{background:color-mix(in srgb,var(--red) 14%,transparent)}
.err{color:var(--red);font-size:14px;margin:8px 4px;min-height:18px}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:99px;background:rgba(120,120,128,.32);position:relative;transition:.2s;margin:0;flex:none;border:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.sw:checked{background:var(--green)}.sw:checked::after{transform:translateX(20px)}
.frow input.sw{flex:none;padding:0}
button.frow{width:100%;text-align:left;justify-content:space-between;color:var(--blue);font-weight:600}
.alertbar{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:70;max-width:560px;margin:0 auto;background:rgba(28,28,30,.97);color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:alertdown .3s}
.alertbar .ai{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;font-weight:700}
.alertbar b{display:block;font-size:15px}.alertbar span{font-size:12px;color:#c7c7cc}
@keyframes alertdown{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
.pill{background:var(--fill);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
#rqov{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rqh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:.5px solid var(--sep)}
.rqi{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--blue);flex:none;text-decoration:none}
.rqb{flex:1;overflow:auto;padding:12px}
.rqc{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-top:.5px solid var(--sep)}
.rqc input{flex:1;height:40px;border-radius:20px;background:var(--fill);padding:0 14px;border:0;outline:0;color:var(--tx);font:inherit}
.rqi.snd{background:var(--blue);color:#fff}
.bub{max-width:82%;padding:8px 10px;border-radius:14px;margin:0 0 8px;font-size:15px;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.bub i{display:block;font-size:11px;opacity:.6;font-style:normal;text-align:right;margin-top:2px}
.bub img{max-width:100%;border-radius:10px;display:block;margin-bottom:4px}
.bub.me{margin-left:auto;background:#d9fdd3;color:#111;border-bottom-right-radius:4px}
.bub.ow{background:var(--card);border-bottom-left-radius:4px}
.bub .bdel{display:block;text-align:right;color:#ff3b30;font-size:13px;font-weight:600;padding:6px 0 0;cursor:pointer}
.sysl{text-align:center;font-size:12px;color:var(--tx2);margin:6px 0 10px}
</style>

<script>
/* ===== mobile-number access: request -> owner approves (config.js needed) ===== */
const SBC=(window.SB&&/^https?:\/\/[a-z0-9]/i.test(window.SB.url||'')&&!/XXXX/.test(window.SB.url)&&(window.SB.key||'').length>=20&&window.SB.key!=='eyJ...')?window.SB:null;
const ROLE_='staff';
const PL={en:{mobile:'Mobile number',device:'Phone name',send:'Request access',badNum:'Enter a valid 10 digit mobile number.',nf:'This number is not registered. Ask the owner to add your number in the Staff page.',showCode:'Show this code to the owner',waiting:'Waiting for owner approval...',cancel:'Cancel',hS:'Enter your mobile number. The owner will approve you.',hK:'Name this phone, for example Door phone. The owner will approve it.',rej:'The owner rejected this request.'},
hi:{mobile:'मोबाइल नंबर',device:'फ़ोन का नाम',send:'एक्सेस मांगें',badNum:'सही 10 अंकों का मोबाइल नंबर भरें।',nf:'यह नंबर दर्ज नहीं है। मालिक से स्टाफ पेज में अपना नंबर जुड़वाएँ।',showCode:'यह कोड मालिक को दिखाएँ',waiting:'मालिक की मंज़ूरी का इंतज़ार...',cancel:'रद्द करें',hS:'अपना मोबाइल नंबर भरें। मालिक आपको मंज़ूरी देंगे।',hK:'इस फ़ोन का नाम लिखें, जैसे Door phone। मालिक मंज़ूरी देंगे।',rej:'मालिक ने यह अनुरोध अस्वीकार किया।'}};
const pt=k=>(PL[lang]||PL.en)[k];
let polling=null;
function phonePart(){
  const q=cfg.req,st=ROLE_==='staff';
  if(q)return `<div class="card" style="text-align:center"><div class="sub">${pt('showCode')}</div><div style="font-size:46px;font-weight:800;letter-spacing:8px;margin:6px 0">${esc(q.vcode)}</div><div class="sub">${q.name?esc(q.name)+' · ':''}${pt('waiting')}</div></div><button class="btn tint" style="width:100%" onclick="reqCancel()">${pt('cancel')}</button>`;
  return `<div class="list"><div class="frow"><label>${st?pt('mobile'):pt('device')}</label><input id="phn" ${st?'inputmode="numeric" maxlength="15" placeholder="98XXXXXXXX"':'placeholder="Door phone"'} autocomplete="off"></div></div><button class="btn pri" id="pgo" style="width:100%" onclick="reqSend()">${pt('send')}</button><div id="pmsg" style="color:var(--red);font-size:14px;margin:8px 4px;min-height:18px">${window._rm||''}</div><div class="sub" style="padding:0 4px">${st?pt('hS'):pt('hK')}</div>`;
}
async function reqSend(){
  const v=$('#phn').value.trim(),m=$('#pmsg'),b=$('#pgo'),st=ROLE_==='staff';
  if(!v||(st&&v.replace(/\D/g,'').length<10)){m.textContent=pt('badNum');return}
  b.disabled=true;m.textContent='';window._rm='';
  try{
    cfg.url=SBC.url.replace(/\/+$/,'');cfg.key=SBC.key;
    if(!cfg.session)await authCall('signup',{data:{}});
    const r=await api('/rest/v1/rpc/request_access',{method:'POST',body:JSON.stringify({p_role:ROLE_,p_phone:st?v:null,p_label:st?null:v})});
    cfg.req={vcode:r.vcode,name:r.name||''};cfg.role=null;saveCfg();render();reqPoll();
  }catch(e){m.textContent=/NUMBER_NOT_FOUND/.test(e.message)?pt('nf'):e.message;b.disabled=false}
}
function reqCancel(){clearInterval(polling);cfg.req=null;saveCfg();render()}
function reqPoll(){
  clearInterval(polling);
  const tick=async()=>{
    if(!cfg.req||!cfg.session)return;
    try{
      const a=await api('/rest/v1/rpc/my_access',{method:'POST',body:'{}'});
      if(a.status==='approved'&&a.role===ROLE_){
        clearInterval(polling);cfg.role=a.role;cfg.sid=a.sid||null;cfg.name=a.name||null;cfg.req=null;saveCfg();
        if(ROLE_==='staff'){D={staff:null,att:[],pay:[],out:[],at:''};render();pull()}
        else{S={faces:{},att:{},outs:{},since:'',queue:[]};persist();render();syncAll()}
      }else if(a.status==='rejected'||a.status==='none'||a.status==='approved'){
        clearInterval(polling);cfg.req=null;saveCfg();window._rm=a.status==='rejected'?pt('rej'):'';render();
      }
    }catch(e){}
  };
  polling=setInterval(tick,4000);tick();
}
addEventListener('load',function(){if(SBC&&cfg.req&&cfg.session&&cfg.role!==ROLE_)reqPoll()});
</script>

  let h=`<div class="bub me"><b>${r.type==='adv'?t('rqAdv'):t('rqLeave')}: ${sum}</b>${r.reason?`<div>${esc(r.reason)}</div>`:''}${r.img?`<img src="${r.img}" style="margin-top:6px" onclick="rqView(this.src)">`:''}<i>${rqTime(r.at)}</i></div>`;
  RQ.msgs.filter(x=>x.rid===rqCur).forEach(x=>{h+=bub(x.from==='owner'?'owner':'staff',x.text,x.img,x.at,x.id)});
  if(r.status!=='pending')h+=`<div class="sysl">${r.status==='approved'?t('rqOk'):t('rqNo')}${r.dat?' \u00b7 '+rqTime(r.dat):''}</div>`;
  m.innerHTML=h;if(first||near)m.scrollTop=m.scrollHeight;
  const cl=$('#rqcall');if(cl)cl.innerHTML=cfg.rqPh?`<a class="rqi" href="tel:${esc(cfg.rqPh)}" title="${t('rqCall')}">${sv('phone',20)}</a>`:'';
  const s=$('#rqst');if(s)s.textContent=r.status==='approved'?t('rqOk'):r.status==='rejected'?t('rqNo'):t('rqWait');
}
async function rqDelMsg(id){
  if(!confirm(t('rqDelQ')))return;
  try{
    const qi=(cfg.rqOut||[]).findIndex(q=>q.id===id);
    if(qi>=0){cfg.rqOut.splice(qi,1);saveCfg()}
    else await api('/rest/v1/rpc/staff_delete_msg',{method:'POST',body:JSON.stringify({p_id:id})});
    RQ.msgs=RQ.msgs.filter(x=>x.id!==id);rqPaint()
  }catch(e){rqWarn(String(e&&e.message||'').slice(0,150)||t('rqFail'))}
}
async function rqMsgPost(text,img){
  const d={rid:rqCur,text:text||'',img:img||null,at:Date.now()},id=rqId('ms');
  try{await rqPost('msg',id,d);RQ.msgs.push(Object.assign({id,from:'staff'},d));rqPaint(true)}catch(e){rqWarn(String(e&&e.message||'').slice(0,150)||t('rqFail'))}
}
function rqSend(){const i=$('#rqx');const v=i.value.trim();if(!v)return;i.value='';rqMsgPost(v,null)}
function rqPickMsg(){rqImg(d=>rqMsgPost('',d))}
document.documentElement.lang=lang;
D=cleanD(D);
render();pull();
setInterval(()=>{if(!document.hidden)pull()},30000);
rqSync();let rqTick=0;setInterval(()=>{if(document.hidden)return;rqTick++;if(rqOv||rqTick%3===0)rqSync()},7000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){quiet=true;pull()}});
</script>
<script>
/* PWA: service worker + install prompt */
(function(){
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',function(){navigator.serviceWorker.register('sw-staff.js',{scope:'./staff.html'}).catch(function(){})});
  if(standalone)return;
  var KEY='staff_inst_hide',bar=null,dp=null,hi=document.documentElement.lang==='hi';
  function hide(){if(bar){bar.remove();bar=null}}
  function show(msg,btn,fn){
    try{if(localStorage.getItem(KEY)==='1')return}catch(e){}
    if(bar||!document.body)return;
    bar=document.createElement('div');
    bar.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;background:#1c1c1e;color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font:14px/1.3 system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.4)';
    bar.innerHTML='<span style="flex:1">'+msg+'</span>'+(btn?'<button id="pwaI" style="background:#0a84ff;color:#fff;border-radius:9px;padding:8px 14px;font-weight:600;border:0">'+btn+'</button>':'')+'<button id="pwaX" style="color:#98989f;font-size:22px;padding:0 4px;border:0;background:none">&times;</button>';
    document.body.appendChild(bar);
    document.getElementById('pwaX').onclick=function(){try{localStorage.setItem(KEY,'1')}catch(e){}hide()};
    if(btn)document.getElementById('pwaI').onclick=fn;
  }
  addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();dp=e;
    show(hi?'Staff App को फ़ोन पर इंस्टॉल करें':'Install Staff App on your phone',hi?'इंस्टॉल':'Install',function(){hide();dp.prompt();dp=null});
  });
  addEventListener('appinstalled',hide);
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))setTimeout(function(){
    show(hi?'इंस्टॉल: Safari में Share दबाएँ, फिर "Add to Home Screen"':'To install: tap Share in Safari, then "Add to Home Screen"',null);
  },2500);
})();
</script>
